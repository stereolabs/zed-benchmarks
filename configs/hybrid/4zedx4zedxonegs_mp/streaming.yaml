# Hybrid 4 ZED X + 4 ZED X One GS Streaming Benchmarks (Multi-Process)
# Each entry launches 8 processes: 4 stereo (ZED X) + 4 mono (ZED X One GS) simultaneously.
name: "Hybrid 4 ZED X + 4 ZED X One GS Streaming MP"
description: "Network streaming performance for 4 ZED X + 4 ZED X One GS (multi-process, simultaneous)"
camera: Hybrid_ZEDX_ZEDXOneGS

defaults:
  warmup: 5
  duration: 30
  num_stereo: 4
  num_mono: 4
  mode: multi_process
  stagger_start: 10
  resolution: HD1200
  camera_fps: 60

benchmarks:
  # ── H264 HD1200@60 (8 cameras simultaneously) ────────────────
  - id: hybrid_mp_streaming_h264_hd1200_60
    name: "Hybrid MP - 4 ZED X + 4 ZED X One GS - H264 - HD1200@60"
    compression_mode_streaming: H264

  # ── H265 HD1200@60 (8 cameras simultaneously) ────────────────
  - id: hybrid_mp_streaming_h265_hd1200_60
    name: "Hybrid MP - 4 ZED X + 4 ZED X One GS - H265 - HD1200@60"
    compression_mode_streaming: H265

  # ── H265 + Depth HD1200@60 (ZED X depth, ZED X One GS streaming only) ───
  - id: hybrid_mp_streaming_h265_depth_hd1200_60
    name: "Hybrid MP - 4 ZED X (H265 + Neural Light Depth) + 4 ZED X One GS (H265) - HD1200@60"
    compression_mode_streaming: H265
    depth_mode: NEURAL_LIGHT
