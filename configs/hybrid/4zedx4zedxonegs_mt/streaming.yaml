# Hybrid 4 ZED X + 4 ZED X One GS Streaming Benchmarks (Multi-Thread)
# Each entry runs all 8 cameras in a single process (one thread per camera).
name: "Hybrid 4 ZED X + 4 ZED X One GS Streaming MT"
description: "Network streaming performance for 4 ZED X + 4 ZED X One GS (multi-thread, simultaneous)"
camera: Hybrid_ZEDX_ZEDXOneGS

defaults:
  warmup: 5
  duration: 30
  num_stereo: 4
  num_mono: 4
  mode: multi_thread
  resolution: HD1200
  camera_fps: 60

benchmarks:
  # ── H264 HD1200@60 (8 cameras simultaneously) ────────────────
  - id: hybrid_mt_streaming_h264_hd1200_60
    name: "Hybrid MT - 4 ZED X + 4 ZED X One GS - H264 - HD1200@60"
    compression_mode_streaming: H264

  # ── H265 HD1200@60 (8 cameras simultaneously) ────────────────
  - id: hybrid_mt_streaming_h265_hd1200_60
    name: "Hybrid MT - 4 ZED X + 4 ZED X One GS - H265 - HD1200@60"
    compression_mode_streaming: H265

  # ── H265 + Depth HD1200@60 (ZED X depth, ZED X One GS streaming only) ───
  - id: hybrid_mt_streaming_h265_depth_hd1200_60
    name: "Hybrid MT - 4 ZED X (H265 + Neural Light Depth) + 4 ZED X One GS (H265) - HD1200@60"
    compression_mode_streaming: H265
    depth_mode: NEURAL_LIGHT
