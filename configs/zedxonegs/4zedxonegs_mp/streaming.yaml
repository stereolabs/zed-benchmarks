# 4 ZED X One GS Streaming Benchmarks (Multi-Process)
name: "4 ZED X One GS Streaming MP"
description: "Network streaming performance for 4 ZED X One GS cameras (multi-process)"
camera: ZEDXOneGS

defaults:
  warmup: 5
  duration: 30
  resolution: HD1200
  camera_fps: 60
  num_stereo: 0
  num_mono: 4
  mode: multi_process
  stagger_start: 10

benchmarks:
  - id: 4zedxonegs_mp_streaming_h264_hd1200_60
    name: "4 ZED X One GS MP - H264 - HD1200@60"
    compression_mode_streaming: H264

  - id: 4zedxonegs_mp_streaming_h265_hd1200_60
    name: "4 ZED X One GS MP - H265 - HD1200@60"
    compression_mode_streaming: H265
