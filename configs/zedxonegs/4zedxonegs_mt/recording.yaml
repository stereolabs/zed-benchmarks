# 4 ZED X One GS Recording Benchmarks (Multi-Thread)
name: "4 ZED X One GS Recording MT"
description: "SVO recording performance for 4 ZED X One GS (multi-thread, single process)"
camera: ZEDXOneGS

defaults:
  warmup: 5
  duration: 30
  resolution: HD1200
  camera_fps: 60
  num_stereo: 0
  num_mono: 4
  mode: multi_thread

benchmarks:
  - id: 4zedxonegs_mt_recording_h264_hd1200_60
    name: "4 ZED X One GS MT - H264 - HD1200@60"
    compression_mode_recording: H264

  - id: 4zedxonegs_mt_recording_h265_hd1200_60
    name: "4 ZED X One GS MT - H265 - HD1200@60"
    compression_mode_recording: H265
