# ZED X One GS Capture Benchmarks
name: "ZED X One GS Capture"
description: "Raw image capture performance for ZED X One GS cameras"
camera: ZEDXOneGS

defaults:
  warmup: 5
  duration: 30
  num_stereo: 0
  num_mono: 1

benchmarks:
  - id: 1zedxonegs_capture_svga_120
    name: "SVGA @ 120 FPS"
    resolution: SVGA
    camera_fps: 120

  - id: 1zedxonegs_capture_hd1080_60
    name: "HD1080 @ 60 FPS"
    resolution: HD1080
    camera_fps: 60

  - id: 1zedxonegs_capture_hd1200_60
    name: "HD1200 @ 60 FPS"
    resolution: HD1200
    camera_fps: 60
