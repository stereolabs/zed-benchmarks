# 4 ZED X Capture Benchmarks (Multi-Process)
name: "4 ZED X Capture MP"
description: "Raw image capture performance for 4 ZED X (multi-process)"
camera: ZEDX

defaults:
  warmup: 5
  duration: 30
  num_stereo: 4
  num_mono: 0
  mode: multi_process
  stagger_start: 10

benchmarks:
  - id: 4zedx_mp_capture_svga_120
    name: "4 ZED X MP - SVGA @ 120 FPS"
    resolution: SVGA
    camera_fps: 120

  - id: 4zedx_mp_capture_hd1080_60
    name: "4 ZED X MP - HD1080 @ 60 FPS"
    resolution: HD1080
    camera_fps: 60

  - id: 4zedx_mp_capture_hd1200_60
    name: "4 ZED X MP - HD1200 @ 60 FPS"
    resolution: HD1200
    camera_fps: 60
