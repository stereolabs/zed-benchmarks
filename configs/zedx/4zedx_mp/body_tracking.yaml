# 4 ZED X Body Tracking Benchmarks (Multi-Process)
name: "4 ZED X Body Tracking MP"
description: "Body tracking performance across different models for 4 ZED X (multi-process)"
camera: ZEDX

defaults:
  warmup: 5
  duration: 30
  resolution: HD1200
  camera_fps: 60
  depth_mode: NEURAL_LIGHT
  num_stereo: 4
  num_mono: 0
  mode: multi_process
  stagger_start: 10

benchmarks:
  - id: 4zedx_mp_bt_fast_hd1200_60
    name: "4 ZED X MP - Body Fast - HD1200@60"
    bt_model: HUMAN_BODY_FAST

  - id: 4zedx_mp_bt_medium_hd1200_60
    name: "4 ZED X MP - Body Medium - HD1200@60"
    bt_model: HUMAN_BODY_MEDIUM

  - id: 4zedx_mp_bt_accurate_hd1200_30
    name: "4 ZED X MP - Body Accurate - HD1200@30"
    camera_fps: 30
    bt_model: HUMAN_BODY_ACCURATE
