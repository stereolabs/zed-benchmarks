# 4 ZED X Streaming Benchmarks (Multi-Thread)
name: "4 ZED X Streaming (MT)"
description: "Network streaming performance for 4 ZED X (multi-thread, single process)"
camera: ZEDX

defaults:
  warmup: 5
  duration: 30
  resolution: HD1200
  camera_fps: 60
  num_stereo: 4
  num_mono: 0
  mode: multi_thread

benchmarks:
  - id: 4zedx_mt_streaming_h264_hd1200_60
    name: "4 ZED X MT - H264 - HD1200@60"
    compression_mode_streaming: H264

  - id: 4zedx_mt_streaming_h265_hd1200_60
    name: "4 ZED X MT - H265 - HD1200@60"
    compression_mode_streaming: H265

  - id: 4zedx_mt_streaming_h265_depth_hd1200_60
    name: "4 ZED X MT - H265 + Neural Light Depth - HD1200@60"
    compression_mode_streaming: H265
    depth_mode: NEURAL_LIGHT
