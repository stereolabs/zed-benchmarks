# 4 ZED X Object Detection Benchmarks (Multi-Thread)
name: "4 ZED X Object Detection (MT)"
description: "Object detection performance across different models for 4 ZED X (multi-thread, single process)"
camera: ZEDX

defaults:
  warmup: 5
  duration: 30
  resolution: HD1200
  camera_fps: 60
  depth_mode: NEURAL_LIGHT
  num_stereo: 4
  num_mono: 0
  mode: multi_thread

benchmarks:
  - id: 4zedx_mt_od_fast_hd1200_60
    name: "4 ZED X MT - Multi-Class Fast - HD1200@60"
    od_model: MULTI_CLASS_BOX_FAST

  - id: 4zedx_mt_od_medium_hd1200_60
    name: "4 ZED X MT - Multi-Class Medium - HD1200@60"
    od_model: MULTI_CLASS_BOX_MEDIUM

  - id: 4zedx_mt_od_accurate_hd1200_30
    name: "4 ZED X MT - Multi-Class Accurate - HD1200@30"
    camera_fps: 30
    od_model: MULTI_CLASS_BOX_ACCURATE
