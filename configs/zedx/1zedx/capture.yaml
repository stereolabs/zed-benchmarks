# ZED X Capture Benchmarks
name: "ZED X Capture"
description: "Raw image capture performance for ZED X cameras"
camera: ZEDX

defaults:
  warmup: 5
  duration: 30
  num_stereo: 1
  num_mono: 0

benchmarks:
  - id: 1zedx_capture_svga_120
    name: "SVGA @ 120 FPS"
    resolution: SVGA
    camera_fps: 120

  - id: 1zedx_capture_hd1080_60
    name: "HD1080 @ 60 FPS"
    resolution: HD1080
    camera_fps: 60

  - id: 1zedx_capture_hd1200_60
    name: "HD1200 @ 60 FPS"
    resolution: HD1200
    camera_fps: 60
