# ZED X Streaming Benchmarks
name: "ZED X Streaming"
description: "Network streaming performance for ZED X"
camera: ZEDX

defaults:
  warmup: 5
  duration: 30
  resolution: HD1200
  camera_fps: 60
  num_stereo: 1
  num_mono: 0

benchmarks:
  - id: 1zedx_streaming_h264_hd1200_60
    name: "H264 - HD1200@60"
    compression_mode_streaming: H264

  - id: 1zedx_streaming_h265_hd1200_60
    name: "H265 - HD1200@60"
    compression_mode_streaming: H265

  - id: 1zedx_streaming_h265_depth_hd1200_60
    name: "H265 + Neural Light Depth - HD1200@60"
    compression_mode_streaming: H265
    depth_mode: NEURAL_LIGHT
