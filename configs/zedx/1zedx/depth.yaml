# ZED X Depth Benchmarks
name: "ZED X Depth"
description: "Depth estimation performance across different modes for ZED X"
camera: ZEDX

defaults:
  warmup: 5
  duration: 30
  resolution: HD1200
  camera_fps: 60
  num_stereo: 1
  num_mono: 0

benchmarks:
  - id: 1zedx_depth_neurallight_hd1200_60
    name: "Neural Light - HD1200@60"
    depth_mode: NEURAL_LIGHT

  - id: 1zedx_depth_neural_hd1200_60
    name: "Neural - HD1200@60"
    depth_mode: NEURAL

  - id: 1zedx_depth_neuralplus_hd1200_30
    name: "Neural+ - HD1200@30"
    camera_fps: 30
    depth_mode: NEURAL_PLUS
