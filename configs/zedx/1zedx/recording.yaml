# ZED X Recording Benchmarks
name: "ZED X Recording"
description: "SVO recording performance with different compression modes for ZED X"
camera: ZEDX

defaults:
  warmup: 5
  duration: 30
  resolution: HD1200
  camera_fps: 60
  num_stereo: 1
  num_mono: 0

benchmarks:
  - id: 1zedx_recording_h264_hd1200_60
    name: "H264 - HD1200@60"
    compression_mode_recording: H264

  - id: 1zedx_recording_h265_hd1200_60
    name: "H265 - HD1200@60"
    compression_mode_recording: H265

  - id: 1zedx_recording_h265_encrypted_hd1200_60
    name: "H265 Encrypted - HD1200@60"
    compression_mode_recording: H265
    encryption_key: "zed-benchmark-test-passphrase"

  - id: 1zedx_recording_h265_depth_hd1200_60
    name: "H265 + Neural Light Depth - HD1200@60"
    compression_mode_recording: H265
    depth_mode: NEURAL_LIGHT
