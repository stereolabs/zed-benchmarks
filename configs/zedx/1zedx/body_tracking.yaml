# ZED X Body Tracking Benchmarks
name: "ZED X Body Tracking"
description: "Body tracking performance across different models for ZED X"
camera: ZEDX

defaults:
  warmup: 5
  duration: 30
  resolution: HD1200
  camera_fps: 60
  depth_mode: NEURAL_LIGHT
  num_stereo: 1
  num_mono: 0

benchmarks:
  - id: 1zedx_bt_fast_hd1200_60
    name: "Body Fast - HD1200@60"
    bt_model: HUMAN_BODY_FAST

  - id: 1zedx_bt_medium_hd1200_60
    name: "Body Medium - HD1200@60"
    bt_model: HUMAN_BODY_MEDIUM

  - id: 1zedx_bt_accurate_hd1200_30
    name: "Body Accurate - HD1200@30"
    camera_fps: 30
    bt_model: HUMAN_BODY_ACCURATE
